function createGate(y, quizInput) {
  // اگر سوال از addNewGate نیامده بود (برای اولین گیت)، تصادفی بگیر
 const quiz = quizInput || quizData[Math.floor(Math.random() * quizData.length)];
  
  let chance3 = Math.min(score * 4, 40); 
  let chance4 = (score < 10) ? 0 : Math.min(score * 0.5, 30); 
  const rand = Math.random() * 100;
  
  let numOptions = (rand < chance4) ? 4 : (rand < (chance4 + chance3) ? 3 : 2);
  let numCorrectsNeeded = (numOptions >= 3 && quiz.correct.length >= 2 && Math.random() > 0.5) ? 2 : 1;
  let selectedCorrects = [...quiz.correct].sort(() => 0.5 - Math.random()).slice(0, numCorrectsNeeded);
  let selectedWrongs = [...quiz.wrongs].sort(() => 0.5 - Math.random()).slice(0, numOptions - selectedCorrects.length);
  let options = [...selectedCorrects, ...selectedWrongs].sort(() => 0.5 - Math.random());
  
  let vx = 0;
  if (score >= 3) {
    // ضریب سختی: هر ۴ امتیاز، ۲۰ درصد سرعت بیشتر (ضرب در سرعت پایه)
    let diffFactor = 1 + Math.floor(score / 4) * 0.25;
    let moveChance = Math.min((score - 3) * 10, 80); 
    if (Math.random() * 100 < moveChance) {
        vx = (1.5 + Math.random() * 2.5) * diffFactor * (Math.random() > 0.5 ? 1 : -1);
    }
  }
  return { y, x: 0, vx, h: 60, quiz, options, scored: false };
}

function spawnObstaclesBetween(startY, endY) {
  const sectionHeight = 500; 
  const numSections = Math.floor(Math.abs(endY - startY) / sectionHeight);
  const wallWidth = 30; // حتماً مطمئن شو این عدد با عرض دیوارت یکی است

  let obstacleDifficulty = 1 + Math.floor(score / 3) * 0.40;
  let spawnChanceLimit = Math.max(0.05, 0.2 - (score / 50));
  const MAX_SPEED = 20;

  for (let i = 0; i < numSections; i++) {
    if (Math.random() > spawnChanceLimit) {
      const rowY = startY + (i * sectionHeight) + 150;
      const isMoving = Math.random() > 0.5;
      const oWidth = 140 + Math.random() * 120;
      const oHeight = 60 + Math.random() * 30;

      // --- اصلاح محدوده X ---
      // فضای خالص بازی = عرض کل منهای عرض دو دیوار
      const playableWidth = canvas.width - (wallWidth * 2);
      // حداکثر X مجاز طوری که انتهای مانع از دیوار راست بیرون نزند
      const maxSafeX = playableWidth - oWidth;
      // شروع از بعد از دیوار چپ (wallWidth) + یک مقدار رندوم در فضای باقی‌مانده
      const safeX = wallWidth + (Math.random() * maxSafeX);

      let finalVx = 0;
      if (isMoving) {
          let calculatedVx = (1.5 + Math.random() * 2.5) * obstacleDifficulty;
          finalVx = Math.min(calculatedVx, MAX_SPEED);
          finalVx *= (Math.random() > 0.5 ? 1 : -1);
      }

      obstacles.push({
        x: safeX, // استفاده از X امن شده
        y: rowY, 
        w: oWidth, 
        h: oHeight,
        vx: finalVx, 
        color: isMoving ? "#e74c3c" : "#D66356"
      });
    }
  }
}function manageFallingStorm() {
  if (score < 10 || !player.alive) return; 

  // ۱. محاسبه ضریب سختی بر اساس تعداد دفعات بارش (مثلاً ۲۰٪ افزایش در هر بار)
  let stormDifficulty = 1 + (stormCount * 0.2);

  if (stormDuration > 0) {
    stormDuration--;
    
    // ۲. افزایش تراکم بر اساس تعداد بارش
    let dynamicSpawnChance = Math.min(0.20, 0.04 * stormDifficulty);

    if (Math.random() < dynamicSpawnChance) {
      // ۳. افزایش سرعت سقوط بر اساس تعداد بارش
      let dynamicVY = Math.min(25, 8 * stormDifficulty);

      fallingObjects.push({
        x: 40 + Math.random() * (canvas.width - 80), 
        y: player.y - canvas.height, 
        radius: 20, 
        vy: dynamicVY, 
        color: "#D66356"
      });
    }
  } 
  else {
    stormTimer--;
    if (stormTimer <= 0) {
        stormCount++; // <<< اضافه کردن به شمارنده در هر بار شروع طوفان جدید
        stormDuration = 90; 
        stormTimer = 1800; 
    }
  }
  // 2. نمایش هشدار (فقط در ۳ ثانیه آخرِ تایمر)
  // 180 فریم = 3 ثانیه
  if (stormTimer > 0 && stormTimer <= 180) {
    ctx.save();
    
    // الف) وینیت قرمز (Red Vignette)
    // یک گرادیانت که وسطش شفاف و دورش قرمز است
    const gradient = ctx.createRadialGradient(
        canvas.width / 2, canvas.height / 2, canvas.height / 3, // دایره داخلی
        canvas.width / 2, canvas.height / 2, canvas.height      // دایره بیرونی
    );
    gradient.addColorStop(0, "rgba(255, 0, 0, 0)"); // وسط شفاف
    gradient.addColorStop(1, "rgba(200, 0, 0, 0.6)"); // دور قرمز تیره
    
    ctx.fillStyle = gradient;
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // ب) نوار سیاه هشدار (وسط صفحه)
    const barHeight = 100;
    const centerY = canvas.height / 2 - barHeight / 2;
    
    ctx.fillStyle = "rgba(0, 0, 0, 0.85)"; // نوار سیاه پررنگ
    ctx.fillRect(0, centerY, canvas.width, barHeight);
    
    // ج) خطوط قرمز بالا و پایین نوار
    ctx.fillStyle = "#e74c3c";
    ctx.fillRect(0, centerY, canvas.width, 5);
    ctx.fillRect(0, centerY + barHeight - 5, canvas.width, 5);

    // د) متن بزرگ هشدار
    ctx.font = "bold 40px IRZeytoon";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    
    // متن چشمک‌زن (سفید و زرد)
    const pulse = Math.floor(Date.now() / 100) % 2;
    ctx.fillStyle = pulse ? "#ffff00" : "#ffffff";
    
    // نمایش ثانیه شمار معکوس (3... 2... 1...)
    const secondsLeft = Math.ceil(stormTimer / 60);
    ctx.fillText(`⚠️ خطر ریزش سنگ ⚠️`, canvas.width / 2, canvas.height / 2);

    ctx.restore();
  }
}
function addNewGate() {
  // ۱. مدیریت کیسه سوالات
  if (quizPool.length === 0) {
    quizPool = Array.from(Array(quizData.length).keys()); // پر کردن کیسه با ایندکس‌ها (0 تا 12)
    quizPool.sort(() => Math.random() - 0.5); // بر زدن تصادفی

    // جلوگیری از تکرار سوال آخر کیسه قبلی با سوال اول کیسه جدید
    if (quizPool[quizPool.length - 1] === lastQuizIndex && quizPool.length > 1) {
      let first = quizPool.pop();
      quizPool.unshift(first);
    }
  }

  // ۲. برداشتن ایندکس سوال بعدی
  const currentQuizIndex = quizPool.pop();
  lastQuizIndex = currentQuizIndex;
  const selectedQuiz = quizData[currentQuizIndex];

  // ۳. بقیه منطق فاصله گذاری خودت
  const prevGateY = lastGateY;
  const gap = minGateDistance + Math.random() * (maxGateDistance - minGateDistance);
  const nextY = lastGateY - gap;

  // ۴. ارسال سوال انتخاب شده به تابع سازنده
  gates.push(createGate(nextY, selectedQuiz)); 
  
  spawnObstaclesBetween(nextY + 350, prevGateY - 350);
  lastGateY = nextY;
}

async function loadSound(name, url) {
    try {
        const response = await fetch(url);
        const arrayBuffer = await response.arrayBuffer();

// تابع پخش بدون تاخیر
function playSound(name, volume = 0.5) {
    if (audioCtx.state === 'suspended') audioCtx.resume();
    if (!soundBuffers[name]) return;

    const source = audioCtx.createBufferSource();
    const gainNode = audioCtx.createGain();
    
    source.buffer = soundBuffers[name];
    gainNode.gain.value = volume;
    
    source.connect(gainNode);
    gainNode.connect(audioCtx.destination);
    source.start(0);
}

      return; 
    }

    const dx = player.x - f.x, dy = player.y - f.y;
    if (player.alive && Math.sqrt(dx*dx + dy*dy) < player.radius + f.radius) triggerGameOver();
    if (f.y > canvas.height + 500) fallingObjects.splice(index, 1);
  });
  manageFallingStorm();
ctx.restore();

  if (activeLaser && activeLaser.life > 0) {
    ctx.save();
    ctx.strokeStyle = "red"; ctx.lineWidth = 8;
    ctx.shadowBlur = 20; ctx.shadowColor = "red";
    ctx.beginPath();
    ctx.moveTo(activeLaser.x1, activeLaser.y);
    ctx.lineTo(activeLaser.x2, activeLaser.y);
    ctx.stroke();
    ctx.strokeStyle = "white"; ctx.lineWidth = 2; ctx.stroke();
    ctx.restore();
    activeLaser.life--;
  }


if (player.alive) {
    const bSize = 84;
    let playerBlockIdx = Math.floor((totalDistance + (canvas.height - player.y)) / bSize);

    // تولید همان اعداد رندوم برای چک کردن برخورد
    let isSafeL = (Math.abs(Math.sin(playerBlockIdx * 12.9898)) % 1) > .7;
    let isSafeR = (Math.abs(Math.sin(playerBlockIdx * 78.233)) % 1) > .7;

    // برخورد چپ
    if (player.x - player.radius < wallWidth) {
        if (isSafeL) {
            player.x = wallWidth + player.radius;
            player.vx = 10;
        } else {
            triggerGameOver('hit');
        }
    }
    // برخورد راست
    else if (player.x + player.radius > canvas.width - wallWidth) {
        if (isSafeR) {
            player.x = canvas.width - wallWidth - player.radius;
            player.vx = -10;
        } else {
            triggerGameOver();
        }
    }

    if (player.x < 0 || player.x > canvas.width || (player.y - 25 > canvas.height && !player.onGround)) {
        triggerGameOver('fall');
    }
}  // --- رسم اسپرایت واکنشی (بدون انیمیشن خودکار) ---
 // --- رسم اسپرایت واکنشی ---
   if (player.alive) {
    ctx.save();
    
    // منطق جدید انتخاب فریم:
    // اگر تایمر پرش بیشتر از صفر است، شکل پرواز (1) را نشان بده
    let currentFrame = (player.jumpTimer > 0) ? 1 : 0; 
    
    // کم کردن تایمر در هر فریم
    if (player.jumpTimer > 0) player.jumpTimer--;

    // انتقال به موقعیت بازیکن
    ctx.translate(player.x, player.y);

    // --- تغییر مهم: آپدیت کردن جهت فقط اگر سرعت زیاد است ---
    // اگر سرعت خیلی کم یا صفر است، دست به facing نزن تا جهت قبلی حفظ شود
    if (Math.abs(player.vx) > 0.5) {
      player.facing = Math.sign(player.vx);
    }
    
    // اعمال جهت (1 برای راست، -1 برای چپ)
    ctx.scale(player.facing, 1);
    // ----------------------------------------------------

    ctx.drawImage(
      playerSprite, 
      currentFrame * spriteWidth, 0, spriteWidth, spriteHeight, 
      -player.radius, -player.radius, player.radius * 2, player.radius * 2 
    );

    ctx.restore();


    // انتقال به موقعیت بازیکن
    ctx.translate(player.x, player.y);

    // --- تغییر مهم: آپدیت کردن جهت فقط اگر سرعت زیاد است ---
    // اگر سرعت خیلی کم یا صفر است، دست به facing نزن تا جهت قبلی حفظ شود
    if (Math.abs(player.vx) > 0.5) {
      player.facing = Math.sign(player.vx);
    }
    
    // اعمال جهت (1 برای راست، -1 برای چپ)
    ctx.scale(player.facing, 1);
    // ----------------------------------------------------

    ctx.drawImage(
      playerSprite, 
      currentFrame * spriteWidth, 0, spriteWidth, spriteHeight, 
      -player.radius, -player.radius, player.radius * 2, player.radius * 2 
    );

    ctx.restore();
  }
  // -----------------------------------------

// --- ۱. تنظیمات دیوار بلوکی متحرک ---
   
  // ایجاد حرکت بر اساس موقعیت عمودی گیت‌ها برای حس واقعی جابجایی
  let scrollOffset = (gates.length > 0) ? (gates[0].y % blockSize) : 0;

 // --- بخش رسم دیوارها با ظاهر متفاوت ---
 // --- ۱. طراحی و رسم دیواره‌های هوشمند ---
// --- رسم دیواره‌های کاملاً رندوم ---
const bSize = 84; 
let wallScroll = totalDistance % bSize;

ctx.save();
for (let y = -bSize; y < canvas.height + bSize; y += bSize) {
    let drawY = y + wallScroll;
    let blockIdx = Math.floor((totalDistance + (canvas.height - drawY)) / bSize);

    // تولید یک عدد "شبه تصادفی" ثابت برای هر ایندکس
    // این عدد بین 0 و 1 است و برای هر blockIdx همیشه ثابت می‌ماند
    let pseudoRandomL = Math.abs(Math.sin(blockIdx * 12.9898)) % 1;
    let pseudoRandomR = Math.abs(Math.sin(blockIdx * 78.233)) % 1;

    // --- رسم دیوار چپ (شروع رندوم) ---
    if (pseudoRandomL > .7) { // ۵۰٪ شانس امن بودن
        ctx.fillStyle = "#1a1a1a"; // امن
        ctx.fillRect(0, drawY, wallWidth, bSize - 4);
        ctx.fillStyle = "cyan";
        ctx.fillRect(wallWidth-5, drawY, 5, bSize-4);
    } else {
        ctx.fillStyle = "#1a1a1a"; // کشنده
        ctx.fillRect(0, drawY, wallWidth, bSize - 4);
        ctx.fillStyle = "#ff3333";
        ctx.shadowBlur = 15; ctx.shadowColor = "red";
        ctx.fillRect(wallWidth - 6, drawY + 5, 4, bSize - 14);
        ctx.shadowBlur = 0;
    }

    // --- رسم دیوار راست (رندوم مستقل) ---
    if (pseudoRandomR > .7) {
        ctx.fillStyle = "#1a1a1a";
        ctx.fillRect(canvas.width - wallWidth, drawY, wallWidth, bSize - 4);
        ctx.fillStyle = "cyan";
        ctx.fillRect(canvas.width - wallWidth, drawY, 5, bSize-4);
    } else {
        ctx.fillStyle = "#1a1a1a";
        ctx.fillRect(canvas.width - wallWidth, drawY, wallWidth, bSize - 4);
        ctx.fillStyle = "#ff3333";
        ctx.shadowBlur = 15; ctx.shadowColor = "red";
        ctx.fillRect(canvas.width - wallWidth + 2, drawY + 5, 4, bSize - 14);
        ctx.shadowBlur = 0;
    }
}
ctx.restore();


  if (flashAlpha > 0) {
    ctx.fillStyle = `rgba(255, 0, 0, ${flashAlpha})`;
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    flashAlpha *= 0.9;
  }

if (currentGroundY < canvas.height + 100) {
    ctx.fillStyle = "#111714";
    // کمی عریض‌تر می‌کشیم تا مطمئن شویم روی لبه دیوارها را می‌پوشاند
    ctx.fillRect(-10, currentGroundY, canvas.width + 20, canvas.height);
  }

// --- ریدیزاین نوار امتیاز (Top Score Bar) ---
  // --- ریدیزاین نوار امتیاز و باکس سوال جداگانه ---
ctx.save();

// ۱. نوار امتیازات (فقط چپ و راست - بدون وسط)
const barHeight = 150;
const barGradient = ctx.createLinearGradient(0, 0, 0, barHeight);
barGradient.addColorStop(0, "rgba(20, 20, 20, 0.9)");
barGradient.addColorStop(1, "rgba(20, 20, 20, 0)"); // محو شدن در پایین

ctx.fillStyle = barGradient;
ctx.fillRect(0, 0, canvas.width, barHeight);

// ۲. استایل امتیاز (سمت چپ)
ctx.textAlign = "center";
ctx.textBaseline = "top";
ctx.font = "24px IRZeytoon";
ctx.fillStyle = "rgba(255, 255, 255, 0.6)";
ctx.fillText("امتیاز", 100, 30);

ctx.font = "bold 120px IRZeytoon";
ctx.fillStyle = "#fff";
ctx.shadowBlur = 5; ctx.shadowColor = "white";
ctx.fillText(score, 100, 40);
ctx.shadowBlur = 0;

// ۳. استایل بهترین رکورد (سمت راست)
ctx.textAlign = "center";
ctx.textBaseline = "top";
ctx.font = "24px IRZeytoon";
ctx.fillStyle = "rgba(255, 215, 0, 0.6)";
ctx.fillText("بهترین", canvas.width - 100, 30);

ctx.font = "bold 80px IRZeytoon";
ctx.fillStyle = "#ffd700";
ctx.shadowBlur = 10; ctx.shadowColor = "#ffd700";
ctx.fillText(highScore || 0, canvas.width - 100, 60);
ctx.shadowBlur = 0;

// ۴. باکس سوال جداگانه (شناور در مرکز)
let activeGate = gates.find(g => g.y < player.y);
if (activeGate && activeGate.y > -100) {
    const quizText = activeGate.quiz.trait;
    ctx.font = "bold 60px IRZeytoon";
    const textWidth = ctx.measureText(quizText).width;
    const boxW = textWidth + 80;
    const boxH = 140;
    const boxX = (canvas.width - boxW) / 2;
    const boxY = 40;

    ctx.save();
    // انیمیشن محو شدن وقتی به گیت نزدیک می‌شویم
    ctx.globalAlpha = Math.min(1, (activeGate.y + 150) / 200);

    // بدنه باکس سوال
    ctx.fillStyle = "rgba(0, 40, 40, 0.8)";
    ctx.strokeStyle = "cyan";
    ctx.lineWidth = 3;
    ctx.shadowBlur = 20; ctx.shadowColor = "cyan";
    
    // رسم باکس با گوشه‌های کمی گرد (مستطیل ساده برای سرعت)
    ctx.fillRect(boxX, boxY, boxW, boxH);
    ctx.strokeRect(boxX, boxY, boxW, boxH);

    // متن سوال داخل باکس
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillStyle = "#00ffff";
    ctx.shadowBlur = 2;
    ctx.fillText(quizText, canvas.width / 2, boxY + boxH / 2 + 5);
    
    ctx.restore();
}

ctx.restore();
  ctx.restore();
  requestAnimationFrame(gameLoop);
}


// آبجکت ذخیره تصاویر سوالات و متغیر کنترل لودینگ تنبل
const imageAssets = {};
let isLazyLoadingStarted = false;

// ۱. آماده‌سازی کیسه سوالات قبل از لودینگ
if (quizPool.length === 0) {
    quizPool = Array.from(Array(quizData.length).keys());
    quizPool.sort(() => Math.random() - 0.5); // بر زدن تصادفی
}

// ۲. برداشتن ۳ سوال اول برای لود ضروری (تا بازی حتماً با آن‌ها شروع شود)
const initialQuestionsCount = 3;
// از انتهای کیسه ۳ تا برمی‌داریم تا با منطق pop() شما هماهنگ باشد
const initialQuizIndices = quizPool.slice(-initialQuestionsCount);

// --- تابع کمکی برای ساخت پرامیسِ لود عکس ---
function loadImagePromise(src, pathKey = null) {
    return new Promise((resolve) => {
        const img = new Image();
        img.onload = () => resolve({ img, pathKey });
        img.onerror = () => resolve({ img: null, pathKey }); // در صورت خطا هم رد شود تا بازی گیر نکند
        img.src = src;
    }).then(result => {
        if (result.pathKey && result.img) {
            imageAssets[result.pathKey] = result.img;
        }
    });
}

// --- مرحله اول: بارگذاری حیاتی (قبل از شروع بازی) ---
function preloadEssentials() {
    const promises = [];

    // لود اسپرایت کاراکتر و پس‌زمینه
    promises.push(loadImagePromise('cards/player_sprite.png'));
    promises.push(loadImagePromise('cards/bg.jpg'));

    // استخراج مسیر عکس‌های ۳ سوال اول
    const essentialPaths = [];
    initialQuizIndices.forEach(index => {
        const q = quizData[index];
        Object.values(q.images).forEach(path => essentialPaths.push(path));
    });

    // اضافه کردن عکس‌های ضروری به لیست پرامیس‌ها (جلوگیری از مسیرهای تکراری)
    [...new Set(essentialPaths)].forEach(path => {
        promises.push(loadImagePromise("cards/" + path, path));
    });

    // اگر پرامیس‌های فونت و صدا را هم ساختید، به این آرایه push کنید
    return Promise.all(promises);
}

// --- مرحله دوم: بارگذاری تنبل (پس از شروع بازی) ---
function lazyLoadRestOfImages() {
    if (isLazyLoadingStarted) return;
    isLazyLoadingStarted = true;

    // استخراج تمام مسیرهای موجود در دیتابیس
    const allPaths = [...new Set(quizData.flatMap(q => Object.values(q.images)))];
    
    // فیلتر کردن عکس‌هایی که در مرحله اول لود نشده‌اند
    const remainingPaths = allPaths.filter(path => !imageAssets[path]);

    console.log(`در حال بارگذاری بی‌سروصدای ${remainingPaths.length} عکس باقی‌مانده...`);

    // لود کردن عکس‌ها در پس‌زمینه
    remainingPaths.forEach(path => {
        const img = new Image();
        img.onload = () => { imageAssets[path] = img; };
        // نکته: اگر عکسی لود نشود، از همان کادر سفید متنی که خودتان طراحی کردید استفاده می‌شود
        img.src = "cards/" + path; 
    });
}

// --- اجرای نهایی بازی ---
console.log("در حال بارگذاری فایل‌های حیاتی...");

preloadEssentials().then(() => {
    console.log("فایل‌های حیاتی لود شدند! شروع بازی...");
    
const spinner = document.getElementById("loading-spinner");
    if (spinner) spinner.style.display = "none";

const guide = document.getElementById("start-guide");
    if (guide) guide.style.display = "flex";

    // شروع بازی
    reset();
    gameLoop();

    // یک ثانیه بعد از شروع بازی، بقیه عکس‌ها را در پس‌زمینه دانلود کن
    // این کار باعث می‌شود تا بچه‌ها از گیت‌های اولیه عبور می‌کنند، کارت‌های گیاهانِ مراحل بعدی کاملاً آماده باشند
    setTimeout(lazyLoadRestOfImages, 1000); 
});
